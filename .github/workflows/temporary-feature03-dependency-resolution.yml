name: Temporary Feature 03 dependency resolution
on:
  push:
    branches: [probe/feature03-dependency-resolution]
permissions:
  contents: read
jobs:
  solver:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, dom, simplexml, pdo_mysql, intl, bcmath, curl, zip, fileinfo, gd
          coverage: none
          tools: composer:v2
      - name: Dry run only (no install or app boot)
        shell: bash
        run: |
          set -euo pipefail
          php -v
          composer --version
          php -r 'if(PHP_MAJOR_VERSION!==8||PHP_MINOR_VERSION!==2||!extension_loaded("gd")||!extension_loaded("fileinfo"))exit(1); echo json_encode(gd_info()),PHP_EOL;'
          test ! -d vendor
          composer validate --strict
          composer audit --locked --no-interaction
          composer require 'spatie/laravel-query-builder:^6.4.4' --dry-run --no-interaction --prefer-dist --no-scripts --no-plugins
          git diff --exit-code -- composer.json composer.lock
          test ! -d vendor
          echo 'T06_DRY_RUN_ONLY_COMPLETE'
