name: Temporary focused avatar verification after security patches
on:
  push:
    branches: [probe/feature03-patched-avatar-tests]
permissions:
  contents: read
jobs:
  avatar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: kids_area_test
          MYSQL_USER: kids_area_ci
          MYSQL_PASSWORD: isolated_ci_only
          MYSQL_ROOT_PASSWORD: isolated_root_ci_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: kids_area_test
      DB_USERNAME: kids_area_ci
      DB_PASSWORD: isolated_ci_only
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, dom, simplexml, pdo_mysql, intl, bcmath, curl, zip, fileinfo, gd
          coverage: none
      - name: Verify approved locked platform and security
        run: |
          composer validate --strict
          composer install --no-interaction --prefer-dist --no-progress
          composer check-platform-reqs
          composer audit --locked
      - name: Prepare guarded disposable environment
        run: |
          test "$APP_ENV" = testing
          test "$DB_DATABASE" = kids_area_test
          test "$DB_USERNAME" = kids_area_ci
          test "$DB_HOST" = 127.0.0.1
          test -z "$DB_URL"
          cp .env.example .env
          php artisan key:generate --force
          php artisan migrate --force
      - name: Focused private avatar PHPUnit
        run: php artisan test --filter='Avatar(Infrastructure|Http)Test'
      - name: Check project formatting
        if: always()
        run: |
          test -x vendor/bin/pint
          vendor/bin/pint --test
      - name: Verify routes, module scope and artifact constraints
        run: |
          php artisan module:list --no-ansi
          php artisan route:list --no-ansi
          php artisan route:cache
          php artisan route:list --no-ansi
          php artisan route:clear
          test -d Modules
          test -d Modules/Identity
          test -z "$(find Modules -mindepth 1 -maxdepth 1 ! -name '.gitkeep' ! -name 'Identity' -print -quit)"
          test -z "$(git ls-files .env)"
          test ! -e app/Models/User.php
          test ! -e database/migrations/0001_01_01_000000_create_users_table.php
          test ! -e database/migrations/0001_01_01_000002_create_jobs_table.php
          test ! -e package.json
          test ! -e vite.config.js
