name: Temporary Feature 03 security solver and native avatar proof
on:
  push:
    branches: [probe/feature03-avatar-security-review]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: gd, fileinfo, mbstring, xml, dom, simplexml, pdo_mysql, intl, bcmath, curl, zip
          coverage: none
          tools: composer:v2
      - name: PHP lint and dependency-free native avatar proof
        shell: bash
        run: |
          set -euo pipefail
          test ! -d vendor
          php -v
          php -r 'echo json_encode(gd_info()),PHP_EOL;'
          find Modules/Identity/app/Services/Avatar -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l Modules/Identity/app/Http/Controllers/UsersController.php
          php -l Modules/Identity/app/Http/Middleware/NormalizeUsersInput.php
          php -l tests/Feature/AvatarHttpTest.php
          php -l tests/Feature/AvatarInfrastructureTest.php
          php -l tests/Support/AvatarFixtures.php
          php -l tests/Support/authentication-router.php
          php -d memory_limit=128M <<'PHP'
          <?php
          require 'Modules/Identity/app/Services/Avatar/AvatarFormat.php';
          require 'Modules/Identity/app/Services/Avatar/NormalizedAvatar.php';
          require 'Modules/Identity/app/Services/Avatar/AvatarImageNormalizer.php';
          require 'tests/Support/AvatarFixtures.php';
          use Modules\Identity\Services\Avatar\AvatarFormat;
          use Modules\Identity\Services\Avatar\AvatarImageNormalizer;
          use Tests\Support\AvatarFixtures;
          function need(bool $pass, string $case): void {
              if (!$pass) throw new RuntimeException($case);
              echo "NATIVE_AVATAR_PASS ".$case.PHP_EOL;
          }
          $n = new AvatarImageNormalizer();
          foreach (['jpg','png','webp'] as $ext) {
              $raw = AvatarFixtures::image($ext,2048,1024);
              $out = $n->normalize($raw,$ext);
              $decoded = imagecreatefromstring($out->bytes);
              need(imagesx($decoded)===512 && imagesy($decoded)===256 && AvatarFormat::structure($out->bytes,$ext),$ext.'_resize');
              if($ext!=='jpg') need(((imagecolorat($decoded,511,255)>>24)&127)===40,$ext.'_alpha');
              unset($decoded,$raw,$out);
          }
          $jpg=AvatarFixtures::image('jpg');
          $png=AvatarFixtures::image('png');
          $webp=AvatarFixtures::image('webp');
          $restart=AvatarFixtures::restartJpeg();
          echo 'NATIVE_RESTART_DIAGNOSTIC '.json_encode(['bytes'=>strlen($restart),'sha256'=>hash('sha256',$restart),'structure'=>AvatarFormat::structure($restart,'jpg'),'mime'=>(new \finfo(FILEINFO_MIME_TYPE))->buffer($restart)]).PHP_EOL;
          need(str_contains($restart,"\xff\xd0")&&str_contains($restart,"\xff\x00")&&$n->normalize($restart,'jpg')->extension==='jpg','independent_jpeg_restart_stuffing');
          need($n->normalize(AvatarFixtures::image('jpg',64,32,true),'jpg')->extension==='jpg','progressive');
          need(!AvatarFormat::structure($jpg.$png."\xff\xd9",'jpg'),'dual_jpeg_png_eoi');
          need(!AvatarFormat::structure(str_replace("\xff\xd0","\xff\xd3",$restart),'jpg'),'bad_restart_order');
          need(!AvatarFormat::structure(substr($png,0,29).chr(ord($png[29])^1).substr($png,30),'png'),'bad_crc');
          need(!AvatarFormat::structure(substr($png,0,33).AvatarFixtures::chunk('acTL',pack('NN',2,0)).substr($png,33),'png'),'apng_marker');
          need(!AvatarFormat::structure($webp.$png,'webp'),'webp_trailing');
          $exact=AvatarFixtures::pngOfSize(AvatarFormat::LIMIT);
          need(strlen($exact)===2097152&&!str_contains($n->normalize($exact,'png')->bytes,'SYNTHETIC-AVATAR-METADATA'),'exact_2m_and_metadata_strip');
          need(!AvatarFormat::structure(AvatarFixtures::pngOfSize(AvatarFormat::LIMIT+1),'png'),'plus_one');
          echo "NATIVE_AVATAR_PEAK ".memory_get_peak_usage(true).PHP_EOL;
          PHP
          test ! -d vendor
      - name: Dry-run exact security patches only (no install)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          composer --version
          test ! -d vendor
          composer validate --strict
          composer update 'symfony/http-kernel:7.4.24' 'symfony/mailer:7.4.24' 'symfony/routing:7.4.24' --dry-run --no-install --no-interaction --no-scripts --no-plugins --prefer-dist
          git diff --exit-code -- composer.json composer.lock
          test ! -d vendor
          echo SECURITY_PATCH_DRY_RUN_ONLY_VERIFIED
