name: Temporary Feature 03 guarded fixture verification
on:
  push:
    branches: [probe/feature03-guarded-fixtures]
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: kids_area_test
          MYSQL_USER: kids_area_ci
          MYSQL_PASSWORD: isolated_ci_only
          MYSQL_ROOT_PASSWORD: isolated_root_ci_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: kids_area_test
      DB_USERNAME: kids_area_ci
      DB_PASSWORD: isolated_ci_only
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, dom, simplexml, pdo_mysql, intl, bcmath, curl, zip, fileinfo, gd
          coverage: none
      - name: Guard target and check native codecs
        run: |
          set -euo pipefail
          test "$APP_ENV" = testing
          test "$DB_HOST" = 127.0.0.1
          test "$DB_DATABASE" = kids_area_test
          test "$DB_USERNAME" = kids_area_ci
          test -z "$DB_URL"
          php -r '$g=gd_info(); if(!extension_loaded("fileinfo")||!$g["PNG Support"]||!$g["JPEG Support"]||!$g["WebP Support"]) exit(1); echo PHP_VERSION." GD codecs verified".PHP_EOL;'
      - name: Install locked dependencies
        run: |
          composer validate --strict
          composer install --no-interaction --prefer-dist --no-progress
          composer check-platform-reqs
      - name: Initialize isolated application
        run: |
          cp .env.example .env
          php artisan key:generate --force
      - name: Approved guarded reset and synthetic fixtures
        run: |
          php artisan test --filter=UsersManagementEnvironmentTest
          php artisan test --filter=AuthenticationConcurrencyTest
          vendor/bin/pint --test tests/Feature/UsersManagementEnvironmentTest.php
          echo T07_GUARDED_FIXTURES_VERIFIED
