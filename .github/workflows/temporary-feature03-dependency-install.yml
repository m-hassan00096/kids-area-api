name: Temporary Feature 03 approved dependency installation
on:
  push:
    branches: [probe/feature03-dependency-install]
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, dom, simplexml, pdo_mysql, intl, bcmath, curl, zip, fileinfo, gd
          coverage: none
          tools: composer:v2
      - name: Resolve exact approved additions before installation
        shell: bash
        run: |
          set -euo pipefail
          php -v
          composer --version
          test ! -d vendor
          php -r 'if(PHP_MAJOR_VERSION!==8||PHP_MINOR_VERSION!==2||!extension_loaded("gd")||!extension_loaded("fileinfo"))exit(1); echo json_encode(gd_info()),PHP_EOL;'
          composer validate --strict
          composer require 'spatie/laravel-query-builder:^6.4.4' 'ext-gd:*' 'ext-fileinfo:*' --no-update --no-interaction --no-scripts --no-plugins
          composer update 'spatie/laravel-query-builder:6.4.4' 'spatie/laravel-package-tools:1.93.3' --no-install --no-interaction --prefer-dist --no-scripts --no-plugins
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          def old(path):
              return json.loads(subprocess.check_output(["git","show","HEAD:"+path]))
          a,b=old("composer.lock"),json.loads(Path("composer.lock").read_bytes())
          old_pkgs={x["name"]:x for x in a["packages"]+a["packages-dev"]}
          new_pkgs={x["name"]:x for x in b["packages"]+b["packages-dev"]}
          expected={"spatie/laravel-query-builder":"6.4.4","spatie/laravel-package-tools":"1.93.3"}
          assert set(new_pkgs)-set(old_pkgs)==set(expected), "unexpected additions"
          assert not set(old_pkgs)-set(new_pkgs), "unexpected removals"
          assert all(new_pkgs[n]==v for n,v in old_pkgs.items()), "existing package metadata changed"
          assert all(new_pkgs[n]["version"]==v for n,v in expected.items()), "unexpected version"
          orig=old("composer.json")
          after=json.loads(Path("composer.json").read_bytes())
          orig["require"].update({"spatie/laravel-query-builder":"^6.4.4","ext-gd":"*","ext-fileinfo":"*"})
          assert orig==after, "unapproved manifest change"
          assert b["platform"]=={**a["platform"],"ext-gd":"*","ext-fileinfo":"*"}
          print("T06_LOCK_DIFF "+json.dumps({"added":expected,"changed_existing":0,"removed":0,"platform":b["platform"]}))
          PY
          composer validate --strict
          composer audit --locked --no-interaction
      - name: Install authentic lock and verify platform
        shell: bash
        run: |
          set -euo pipefail
          composer install --no-interaction --prefer-dist --no-progress --no-scripts
          composer check-platform-reqs
          php -r 'require "vendor/autoload.php"; foreach(["spatie/laravel-query-builder"=>"6.4.4","spatie/laravel-package-tools"=>"1.93.3"] as $n=>$v){$actual=Composer\InstalledVersions::getPrettyVersion($n);if($actual!==$v){fwrite(STDERR,$n.":".$actual);exit(1);}echo $n." ".$actual.PHP_EOL;} if(!class_exists(Spatie\QueryBuilder\QueryBuilder::class))exit(1);'
          composer validate --strict
          composer audit --locked --no-interaction
          python3 - <<'PY'
          import json, subprocess, difflib
          from pathlib import Path
          for path in ["composer.json","composer.lock"]:
              old=subprocess.check_output(["git","show","HEAD:"+path]).decode("utf-8").splitlines(keepends=True)
              raw=Path(path).read_bytes()
              new=raw.decode("utf-8").splitlines(keepends=True)
              for tag,i,j,k,l in difflib.SequenceMatcher(None,old,new,autojunk=False).get_opcodes():
                  if tag!="equal":
                      print("T06_REPLAY "+json.dumps({"path":path,"start":i,"end":j,"old":old[i:j],"new":new[k:l]},ensure_ascii=True))
              sha=subprocess.check_output(["git","hash-object",path],text=True).strip()
              print("T06_BLOB "+json.dumps({"path":path,"sha":sha,"bytes":len(raw)}))
          PY
          echo T06_APPROVED_INSTALL_VERIFIED
