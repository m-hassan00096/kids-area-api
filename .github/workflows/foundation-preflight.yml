name: Foundation PHP 8.2 preflight

on:
  push:
    branches:
      - feature/foundation-laravel12-bootstrap
    paths:
      - '.github/workflows/foundation-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform-preflight:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: kids_area_test
          MYSQL_USER: kids_area_ci
          MYSQL_PASSWORD: isolated_ci_only
          MYSQL_ROOT_PASSWORD: isolated_root_ci_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP 8.2 for approved Foundation
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, dom, simplexml, pdo_mysql, intl, bcmath, fileinfo, curl, zip
          coverage: none
      - name: Record actual PHP 8.2 / Composer platform
        run: |
          php -v
          php -m
          composer --version
          php -r 'if (PHP_MAJOR_VERSION !== 8 || PHP_MINOR_VERSION !== 2) { exit(1); }'
          php -r 'foreach (["mbstring", "dom", "SimpleXML", "pdo_mysql", "intl", "bcmath", "fileinfo"] as $ext) { if (!extension_loaded($ext)) { fwrite(STDERR, "Missing $ext\n"); exit(1); } }'
      - name: Verify isolated MySQL 8
        env:
          MYSQL_PWD: isolated_ci_only
        run: |
          php -r '$pdo = new PDO("mysql:host=127.0.0.1;port=3306;dbname=kids_area_test;charset=utf8mb4", "kids_area_ci", getenv("MYSQL_PWD"), [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]); $version = $pdo->query("SELECT VERSION()")->fetchColumn(); echo "MySQL version: $version\n"; if (!str_starts_with($version, "8.")) { exit(1); }'
