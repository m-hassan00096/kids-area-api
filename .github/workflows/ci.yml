name: Backend CI (PHP 8.2 / MySQL 8)

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    name: Laravel 12 Foundation tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: kids_area_test
          MYSQL_USER: kids_area_ci
          MYSQL_PASSWORD: isolated_ci_only
          MYSQL_ROOT_PASSWORD: isolated_root_ci_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_URL: ''
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: kids_area_test
      DB_USERNAME: kids_area_ci
      DB_PASSWORD: isolated_ci_only
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, dom, simplexml, pdo_mysql, intl, bcmath, curl, zip, fileinfo, gd
          coverage: none
      - name: Validate dependency lock
        run: |
          php -v
          composer --version
          test -s composer.lock
          composer validate --strict
      - name: Install locked dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          composer check-platform-reqs
          composer audit --locked
      - name: Set up isolated application key
        run: |
          cp .env.example .env
          php artisan key:generate --force
      - name: Verify required native extensions and codecs
        run: |
          php <<'PHP'
          <?php
          if (!extension_loaded('gd') || !extension_loaded('fileinfo')) {
              exit(1);
          }
          $gd = gd_info();
          foreach (['PNG Support', 'JPEG Support', 'WebP Support'] as $codec) {
              if (($gd[$codec] ?? false) !== true) {
                  exit(1);
              }
          }
          foreach (['imagecreatefromstring', 'imagepng', 'imagejpeg', 'imagewebp'] as $function) {
              if (!function_exists($function)) {
                  exit(1);
              }
          }
          echo "Native GD, fileinfo and PNG/JPEG/WebP codec checks passed.\n";
          PHP
      - name: Verify guarded disposable database before migrations
        run: |
          php <<'PHP'
          <?php
          require 'vendor/autoload.php';
          $app = require 'bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $db = $app->make('db')->connection();
          if (!$app->environment('testing') || $db->getDriverName() !== 'mysql'
              || $db->getConfig('host') !== '127.0.0.1' || $db->getDatabaseName() !== 'kids_area_test'
              || $db->getConfig('username') !== 'kids_area_ci' || getenv('DB_URL') !== '') {
              exit(1);
          }
          $server = $db->selectOne('SELECT DATABASE() AS db, CURRENT_USER() AS principal, VERSION() AS version, @@default_storage_engine AS engine');
          if ($server->db !== 'kids_area_test' || !str_starts_with($server->principal, 'kids_area_ci@')
              || !str_starts_with($server->version, '8.') || $server->engine !== 'InnoDB') {
              exit(1);
          }
          echo "Disposable MySQL 8/InnoDB guard passed.\n";
          PHP
      - name: Run reviewed pre-F04 migrations in disposable test database
        run: |
          php artisan migrate --force \
            --path=Modules/Identity/database/migrations/2026_11_25_000001_create_users_table.php \
            --path=Modules/Identity/database/migrations/2026_11_25_000002_create_permission_tables.php \
            --path=Modules/Identity/database/migrations/2026_11_25_000003_enforce_single_staff_role.php \
            --path=Modules/Identity/database/migrations/2026_11_25_000004_add_auth_version_to_users.php \
            --path=Modules/Identity/database/migrations/2026_11_25_000005_create_sessions_table.php \
            --path=Modules/Identity/database/migrations/2026_11_25_000006_create_identity_login_throttles_table.php \
            --path=Modules/Identity/database/migrations/2026_11_25_000007_add_avatar_key_to_users.php
      - name: Verify synthetic legacy backup and forward Roles migration preservation
        run: |
          set -o pipefail
          php tests/Support/roles-migration-preflight.php | tee "$RUNNER_TEMP/roles-forward.log"
          grep -q '^ROLES_LEGACY_FIXTURE {' "$RUNNER_TEMP/roles-forward.log"
          grep -q '^ROLES_FORWARD_MIGRATION {' "$RUNNER_TEMP/roles-forward.log"
      - name: Verify additive Activity migrations preserve populated Identity fixture
        run: |
          set -o pipefail
          php tests/Support/activity-schema-forward.php | tee "$RUNNER_TEMP/activity-forward.log"
          grep -q '^ACTIVITY_FORWARD_MIGRATIONS {' "$RUNNER_TEMP/activity-forward.log"
      - name: Verify focused Activity foundation test discovery
        run: |
          vendor/bin/phpunit --list-tests --filter='ActivitySchema|ActivityConstraintErrors|ActivityProvisioning' > "$RUNNER_TEMP/activity-tests.txt"
          grep -Fq 'Tests\Feature\ActivitySchemaTest::' "$RUNNER_TEMP/activity-tests.txt"
          grep -Fq 'Tests\Feature\ActivityConstraintErrorsTest::' "$RUNNER_TEMP/activity-tests.txt"
          grep -Fq 'Tests\Feature\ActivityProvisioningTest::' "$RUNNER_TEMP/activity-tests.txt"
          cat "$RUNNER_TEMP/activity-tests.txt"
      - name: Run focused Activity foundation tests
        run: php artisan test --filter='ActivitySchema|ActivityConstraintErrors|ActivityProvisioning'
      - name: Verify focused Activity API test discovery
        run: |
          vendor/bin/phpunit --list-tests --filter='ActivityReadHttp|ActivitySelectHttp|ActivityWriteHttp|ActivityRaceHttp|ActivityFaultHttp' > "$RUNNER_TEMP/activity-api-tests.txt"
          for source in tests/Feature/Activity*HttpTest.php; do
            class="$(basename "$source" .php)"
            grep -Fq "Tests\\Feature\\${class}::" "$RUNNER_TEMP/activity-api-tests.txt"
          done
          cat "$RUNNER_TEMP/activity-api-tests.txt"
      - name: Run focused Activity API tests
        run: php artisan test --filter='ActivityReadHttp|ActivitySelectHttp|ActivityWriteHttp|ActivityRaceHttp|ActivityFaultHttp'
      - name: Verify Activity performance test discovery
        run: |
          vendor/bin/phpunit --list-tests --filter=ActivityPerformance > "$RUNNER_TEMP/activity-perf-tests.txt"
          grep -Fq 'Tests\Feature\ActivityPerformanceTest::' "$RUNNER_TEMP/activity-perf-tests.txt"
          cat "$RUNNER_TEMP/activity-perf-tests.txt"
      - name: Measure guarded Activity performance
        run: php artisan test --filter=ActivityPerformance
      - name: Run focused Authentication tests
        run: php artisan test --filter=Authentication
      - name: Run focused Identity tests
        run: php artisan test --filter=Identity
      - name: Verify focused Users and Selects test discovery
        run: |
          vendor/bin/phpunit --list-tests --filter='Users|Avatar|SelectRegistry' > "$RUNNER_TEMP/users-tests.txt"
          for source in tests/Feature/Users*Test.php tests/Feature/Avatar*Test.php tests/Feature/SelectRegistry*Test.php; do
            class="$(basename "$source" .php)"
            grep -Fq "Tests\\Feature\\${class}::" "$RUNNER_TEMP/users-tests.txt"
          done
          cat "$RUNNER_TEMP/users-tests.txt"
      - name: Run focused Users Management, Avatar and Select Registry tests
        run: php artisan test --filter='Users|Avatar|SelectRegistry'
      - name: Verify focused Roles test discovery
        run: |
          vendor/bin/phpunit --list-tests --filter=Roles > "$RUNNER_TEMP/roles-tests.txt"
          for source in tests/Feature/Roles*Test.php; do
            class="$(basename "$source" .php)"
            grep -Fq "Tests\\Feature\\${class}::" "$RUNNER_TEMP/roles-tests.txt"
          done
          cat "$RUNNER_TEMP/roles-tests.txt"
      - name: Run focused Roles tests
        run: php artisan test --filter=Roles
      - name: Run PHPUnit
        run: php artisan test
      - name: Check Laravel Pint
        run: vendor/bin/pint --test -v
      - name: Verify modular package CLI and approved Identity, Activities and People only
        run: |
          php artisan module:list --no-ansi
          php artisan route:list --no-ansi
          php artisan route:cache
          php artisan route:list --no-ansi
          php artisan route:clear
          test -d Modules
          test -d Modules/Identity
          test -d Modules/Activities
          test -d Modules/People
          test -z "$(find Modules -mindepth 1 -maxdepth 1 ! -name '.gitkeep' ! -name 'Identity' ! -name 'Activities' ! -name 'People' -print -quit)"
      - name: Ensure out-of-scope artifacts were not generated
        run: |
          test -z "$(git ls-files .env)"
          test ! -e app/Models/User.php
          test ! -e database/migrations/0001_01_01_000000_create_users_table.php
          test ! -e database/migrations/0001_01_01_000002_create_jobs_table.php
          test ! -e package.json
          test ! -e vite.config.js

  activity-preflight:
    name: Activity Catalogue guarded MySQL preflight
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: kids_area_test
          MYSQL_USER: kids_area_ci
          MYSQL_PASSWORD: isolated_ci_only
          MYSQL_ROOT_PASSWORD: isolated_root_ci_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_URL: ''
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: kids_area_test
      DB_USERNAME: kids_area_ci
      DB_PASSWORD: isolated_ci_only
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      ACTIVITY_PREFLIGHT_ISOLATED_JOB: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, dom, simplexml, pdo_mysql, intl, bcmath, curl, zip, fileinfo, gd
          coverage: none
      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Set up isolated application key
        run: |
          cp .env.example .env
          php artisan key:generate --force
      - name: Inventory actual RBAC, migrations, route and test consumers
        run: |
          git grep -n -E 'IdentityPermissions::|PermissionCatalogue::|assertSame\(10,|assertCount\(10,|assertSame\(19,|assertCount\(19,|fixtureMigrationPaths|IdentityScopeTest|migrate:fresh|module:list|SHOW TABLES|TABLE_NAME.*\)|role_has_permissions' -- Modules app routes database tests .github/workflows/ci.yml
          git ls-files 'Modules/*/module.json' 'Modules/*/composer.json' 'Modules/*/database/migrations/*' 'tests/Feature/*Test.php' 'tests/Support/*'
      - name: Verify real MySQL collation and approved DDL fixture
        run: |
          set -o pipefail
          php tests/Support/activity-catalogue-preflight.php | tee "$RUNNER_TEMP/activity-preflight.log"
          grep -q '^ACTIVITY_PREFLIGHT_ENV {' "$RUNNER_TEMP/activity-preflight.log"
          grep -q '^ACTIVITY_PREFLIGHT_BASELINE {' "$RUNNER_TEMP/activity-preflight.log"
          grep -q '^ACTIVITY_PREFLIGHT_DDL {' "$RUNNER_TEMP/activity-preflight.log"
          grep -q '^ACTIVITY_PREFLIGHT_COLLATION ' "$RUNNER_TEMP/activity-preflight.log"
          grep -q '^ACTIVITY_PREFLIGHT_LITERAL_SEARCH ' "$RUNNER_TEMP/activity-preflight.log"
          grep -q '^ACTIVITY_PREFLIGHT_PRICE_GRAMMAR {' "$RUNNER_TEMP/activity-preflight.log"
          grep -q '^ACTIVITY_PREFLIGHT_CONSTRAINTS {' "$RUNNER_TEMP/activity-preflight.log"
          grep -q '^ACTIVITY_PREFLIGHT_RESULT {' "$RUNNER_TEMP/activity-preflight.log"

  customer-preflight:
    name: Customer guarded MySQL preflight
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: kids_area_test
          MYSQL_USER: kids_area_ci
          MYSQL_PASSWORD: isolated_ci_only
          MYSQL_ROOT_PASSWORD: isolated_root_ci_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_URL: ''
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: kids_area_test
      DB_USERNAME: kids_area_ci
      DB_PASSWORD: isolated_ci_only
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      CUSTOMER_PREFLIGHT_ISOLATED_JOB: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, dom, simplexml, pdo_mysql, intl, bcmath, curl, zip, fileinfo, gd
          coverage: none
      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Set up isolated application key
        run: |
          cp .env.example .env
          php artisan key:generate --force
      - name: Inventory existing module, permissions, routes and test consumers
        run: |
          git ls-files 'Modules/*/module.json' 'Modules/*/composer.json' 'Modules/*/database/migrations/*' 'tests/Feature/*Test.php' 'tests/Support/*'
          git grep -n -E 'IdentityPermissions::|ActivityPermissions::|PermissionCatalogue::|identity_feature_provisions|assert(Same|Count)\((10|15|24),|fixtureMigrationPaths|approvedRoutes|modules_statuses|TABLE_NAME|module:list|migrate:fresh' -- Modules app routes database tests .github/workflows/ci.yml
          echo 'CUSTOMER_PREFLIGHT_INVENTORY verified tracked source consumers'
      - name: Verify exact approved Customer DDL in guarded MySQL
        run: |
          set -o pipefail
          php tests/Support/customer-catalogue-preflight.php | tee "$RUNNER_TEMP/customer-preflight.log"
          grep -q '^CUSTOMER_PREFLIGHT_ENV {' "$RUNNER_TEMP/customer-preflight.log"
          grep -q '^CUSTOMER_PREFLIGHT_BASELINE {' "$RUNNER_TEMP/customer-preflight.log"
          grep -q '^CUSTOMER_PREFLIGHT_DDL {' "$RUNNER_TEMP/customer-preflight.log"
          grep -q '^CUSTOMER_PREFLIGHT_CONSTRAINTS {' "$RUNNER_TEMP/customer-preflight.log"
          grep -q '^CUSTOMER_PREFLIGHT_RESULT {' "$RUNNER_TEMP/customer-preflight.log"
      - name: Verify People module discovery and actual Customer schema test discovery
        run: |
          composer validate --strict
          php artisan module:list --no-ansi
          vendor/bin/phpunit --list-tests --filter=CustomerSchema > "$RUNNER_TEMP/customer-schema-tests.txt"
          grep -Fq 'Tests\Feature\CustomerSchemaTest::' "$RUNNER_TEMP/customer-schema-tests.txt"
          cat "$RUNNER_TEMP/customer-schema-tests.txt"
      - name: Run focused Customer migration and enum tests
        run: php artisan test --filter=CustomerSchema
      - name: Verify guarded populated Customer forward migration
        run: |
          set -o pipefail
          vendor/bin/phpunit --list-tests --filter=CustomerForwardMigration > "$RUNNER_TEMP/customer-forward-tests.txt"
          grep -Fq 'Tests\Feature\CustomerForwardMigrationTest::test_customer_forward_migration_preserves_the_populated_ten_migration_baseline' "$RUNNER_TEMP/customer-forward-tests.txt"
          php artisan test --filter=CustomerForwardMigration | tee "$RUNNER_TEMP/customer-forward.log"
          grep -q '^CUSTOMER_FORWARD_MIGRATION {' "$RUNNER_TEMP/customer-forward.log"
      - name: Verify focused Customer provisioning test discovery
        run: |
          vendor/bin/phpunit --list-tests --filter='CustomerProvisioning|overlapping_customer_provisions' > "$RUNNER_TEMP/customer-provisioning-tests.txt"
          grep -Fq 'Tests\Feature\CustomerProvisioningTest::' "$RUNNER_TEMP/customer-provisioning-tests.txt"
          grep -Fq 'Tests\Feature\IdentityConcurrencyTest::test_overlapping_customer_provisions_serialize_once' "$RUNNER_TEMP/customer-provisioning-tests.txt"
      - name: Verify guarded Customer permissions and one-time grants
        run: php artisan test --filter='CustomerProvisioning|overlapping_customer_provisions'
      - name: Verify Customer API foundation test discovery
        run: |
          vendor/bin/phpunit --list-tests --filter='CustomerConstraintErrors|CustomerApiFoundationHttp|CustomerPrivacy' > "$RUNNER_TEMP/customer-api-foundation-tests.txt"
          for class in CustomerConstraintErrorsTest CustomerApiFoundationHttpTest CustomerPrivacyTest; do
            grep -Fq "Tests\\Feature\\${class}::" "$RUNNER_TEMP/customer-api-foundation-tests.txt"
          done
      - name: Run focused Customer API foundation and privacy tests
        run: php artisan test --filter='CustomerConstraintErrors|CustomerApiFoundationHttp|CustomerPrivacy'
      - name: Verify Customer Select and authorization test discovery
        run: |
          vendor/bin/phpunit --list-tests --filter='CustomerSelectHttp|CustomerAuthorizationHttp' > "$RUNNER_TEMP/customer-select-tests.txt"
          grep -Fq 'Tests\Feature\CustomerSelectHttpTest::' "$RUNNER_TEMP/customer-select-tests.txt"
          grep -Fq 'Tests\Feature\CustomerAuthorizationHttpTest::' "$RUNNER_TEMP/customer-select-tests.txt"
      - name: Run focused Customer Select and authorization tests
        run: php artisan test --filter='CustomerSelectHttp|CustomerAuthorizationHttp'
