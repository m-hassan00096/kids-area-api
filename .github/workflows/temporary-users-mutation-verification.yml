name: Temporary focused Users validation and mutation verification
on:
  push:
    branches: [probe/feature03-mutation-verification]
permissions:
  contents: read
jobs:
  users:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: kids_area_test
          MYSQL_USER: kids_area_ci
          MYSQL_PASSWORD: isolated_ci_only
          MYSQL_ROOT_PASSWORD: isolated_root_ci_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: kids_area_test
      DB_USERNAME: kids_area_ci
      DB_PASSWORD: isolated_ci_only
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, dom, simplexml, pdo_mysql, intl, bcmath, curl, zip, fileinfo, gd
          coverage: none
      - name: Verify locked platform and security
        run: |
          composer validate --strict
          composer install --no-interaction --prefer-dist --no-progress
          composer check-platform-reqs
          composer audit --locked
      - name: Prepare guarded disposable environment
        run: |
          test "$APP_ENV" = testing
          test "$DB_DATABASE" = kids_area_test
          test "$DB_USERNAME" = kids_area_ci
          test "$DB_HOST" = 127.0.0.1
          test -z "$DB_URL"
          cp .env.example .env
          php artisan key:generate --force
          php artisan migrate --force
      - name: Focused Users validation, constraints and mutation PHPUnit
        run: php artisan test --filter='UsersMutationValidationTest|UsersConstraintErrorsTest|UsersMutationTransactionTest|UsersManagementTransportTest|UsersManagementBoundaryTest'
      - name: Focused prior contested-query observation and explicit GC probe
        if: always()
        run: |
          for i in 1 2 3 4 5; do
            echo "CONTESTED_QUERY_REPEAT $i"
            php artisan test --filter=test_login_commit_first_is_revoked_by_waiting_password_change
          done
          php artisan test --filter=AuthenticationApiBoundaryTest
      - name: Check project formatting and exact Pint diagnostics
        if: always()
        run: vendor/bin/pint --test -v
