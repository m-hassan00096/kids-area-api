name: Temporary Identity dependency resolution (remove before implementation review)

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve approved Spatie v6 dependency in isolated CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, dom, simplexml, pdo_mysql, intl, bcmath, curl, zip, fileinfo
          coverage: none
      - name: Verify baseline and resolve approved dependency
        run: |
          composer validate --strict
          composer require 'spatie/laravel-permission:^6.0' --no-interaction --prefer-dist
          composer validate --strict
          composer check-platform-reqs
          composer show spatie/laravel-permission
          composer show nwidart/laravel-modules
      - name: Output only dependency file diff for review
        run: |
          git diff --no-color -- composer.json composer.lock
          sha256sum composer.json composer.lock
          php artisan module:list --no-ansi
